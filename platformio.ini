; PlatformIO config for the force-sensor robotic claw.
;
; Two environments are defined because the Arduino Nano ships with two
; different bootloaders and you can't tell which one you have without
; trying. Defaults to the new bootloader. If `pio run -t upload` fails
; with "avrdude: stk500_recv(): programmer is not responding" or
; "not in sync", switch to the old-bootloader env:
;
;   pio run -e nano_old -t upload
;
; Port is auto-detected. If you have multiple serial devices plugged
; in, uncomment upload_port / monitor_port and point them at the right
; /dev/cu.* device (FTDI: cu.usbserial-* or cu.usbmodem*; CH340 clones:
; cu.wchusbserial*).

[platformio]
default_envs = nano_new
src_dir = src

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX

; Modern Arduino Nano (sold since ~2018, official boards).
; Bootloader runs at 115200 baud.
[env:nano_new]
board = nanoatmega328new

; Older Nanos and some clones. Bootloader runs at 57600 baud.
[env:nano_old]
board = nanoatmega328
